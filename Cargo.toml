[package]
name = "idevice-napi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "napi-rs bindings for idevice — iOS device services for Node.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
idevice = { version = "0.1", features = [
  "usbmuxd",
  "afc",
  "installation_proxy",
  "screenshotr",
  "syslog_relay",
  "companion_proxy",
  "rsd",
] }
napi = { version = "2", features = ["serde-json", "napi9", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
base64 = "0.22"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
opt-level = "z"
